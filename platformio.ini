; PlatformIO Project Configuration File
; SolarControl-Matter
; Board : esp32-s3-devkitc-1-n16r8v (16MB Flash, 8MB PSRAM)
; Author: Robothaler
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs = matter_serial

; ─────────────────────────────────────────────────────────────────────────────
; Gemeinsame Basis-Konfiguration
; ─────────────────────────────────────────────────────────────────────────────
[env]
extra_scripts = pre:scripts/build_hook.py
platform     = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board        = esp32-s3-devkitc-1-n16r8v
framework    = arduino
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

build_flags =
  -I include
  -I "/home/robothaler/credentials"

  ; ── Debug ─────────────────────────────────────────────────────────────────
  -D CORE_DEBUG_LEVEL=3

  ; ── Board-Konfiguration ───────────────────────────────────────────────────
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

  ; ── AsyncTCP Tuning (identisch PoolMaster) ────────────────────────────────
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D CONFIG_ESP32_ENABLE_COREDUMP=1

  ; ── SPI2 Bus – 2× MAX31865 PT1000 (shared Bus, je eigener CS) ────────────
  -D PIN_SPI_SCK=12
  -D PIN_SPI_MOSI=11
  -D PIN_SPI_MISO=13
  -D PIN_CS_MAX31865_ROOF=10     ; Kollektor / Dach
  -D PIN_CS_MAX31865_BOILER=14   ; Boiler / Warmwasser

  ; ── OneWire Bus – DS18B20 (2 Sensoren: Puffer + Rücklauf) ────────────────
  -D PIN_DS18B20=4

  ; ── I2C Bus – OLED Display (optional) ────────────────────────────────────
  -D PIN_I2C_SDA=8
  -D PIN_I2C_SCL=9

  ; ── Relais-Ausgänge (HIGH = aktiv) ───────────────────────────────────────
  -D PIN_RELAY_PUMP=15
  -D PIN_RELAY_VALVE=16
  -D PIN_RELAY_CIRC=17
  -D PIN_RELAY_ILLUM=18

  ; ── Digitale Eingänge ─────────────────────────────────────────────────────
  -D PIN_VALVE_STATUS=5
  -D PIN_BUTTON=6
  -D PIN_MOTION=7
  -D PIN_MOTION_POWER=21

  ; ── Analoger Eingang – Pegelsonde (ADC1, WiFi/Matter-sicher) ─────────────
  -D PIN_LEVEL_SENSOR=2

  ; ── WebUI & OTA ───────────────────────────────────────────────────────────
  -D CONFIG_HTTPD_WS_SUPPORT=1

lib_compat_mode = strict
lib_ldf_mode    = chain

lib_deps =
  ; ── Temperatursensoren ────────────────────────────────────────────────────
  adafruit/Adafruit MAX31865 library @ ^1.5.0
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0

  ; ── JSON & Utilities ──────────────────────────────────────────────────────
  bblanchon/ArduinoJson @ 6.17.2
  Arduino_DebugUtils @ 1.4.0
  robtillaart/RunningMedian @ 0.3.9

  ; ── Web & Async ───────────────────────────────────────────────────────────
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer

  ; ── Display ───────────────────────────────────────────────────────────────
  olikraus/U8g2 @ ^2.35.19

  ; QR-Code: espressif/qrcode via src/idf_component.yml (IDF-native, selbe API wie ricmoo)

; ─────────────────────────────────────────────────────────────────────────────
[env:serial_upload]
lib_deps   = ${env.lib_deps}
build_flags =
  ${env.build_flags}
upload_protocol = esptool
upload_port     = COM6
monitor_port    = COM6
monitor_speed   = 115200

; ─────────────────────────────────────────────────────────────────────────────
[env:OTA_upload]
lib_deps   = ${env.lib_deps}
build_flags =
  ${env.build_flags}
upload_protocol = espota
upload_port     = 192.168.178.156
upload_flags    =
  --port=8063
  --auth=Fgixy001

; ─────────────────────────────────────────────────────────────────────────────
[env:matter_serial]
framework  = espidf, arduino
lib_deps   = ${env.lib_deps}
lib_ignore =
  OpenThread
  BLE
  BluetoothSerial
  SimpleBLE
  WiFiProv
  Insights
  RainMaker
  Zigbee
  ESP_SR
  ESP_I2S

build_unflags =
  -std=c++17
  -std=gnu++2b
  -mdisable-hardware-atomics

build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D MATTER_ENABLED
  -D CHIP_HAVE_CONFIG_H
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D ARDUINO_LOOP_STACK_SIZE=8192
  -D CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192

upload_protocol = esptool
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed   = 115200

; ─────────────────────────────────────────────────────────────────────────────
[env:matter_ota]
framework  = espidf, arduino
lib_deps   = ${env.lib_deps}
lib_ignore =
  OpenThread
  BLE
  BluetoothSerial
  SimpleBLE
  WiFiProv
  Insights
  RainMaker
  Zigbee
  ESP_SR
  ESP_I2S

build_unflags =
  -std=c++17
  -std=gnu++2b
  -mdisable-hardware-atomics

build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D MATTER_ENABLED
  -D CHIP_HAVE_CONFIG_H
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D ARDUINO_LOOP_STACK_SIZE=8192
  -D CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192

upload_protocol = espota
upload_port     = 192.168.178.156
upload_flags    =
  --port=8063
  --auth=Fgixy001
